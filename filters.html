<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtered Image Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <h1 class="text-2xl font-bold mb-6 text-center bg-black text-white">FILTERS IN TAILWINDCSS USED</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <img src="./Valkyrie.jpeg" alt="" class="w-full h-60 object-cover filter brightness-200">
      <div class="p-4">
        <h2 class="font-semibold text-lg">Vivid Color Boost</h2>
        <p class="text-sm text-gray-600"><span class="font-bold">Filter brightness-[number]</span>Enhanced brightness, contrast & saturation.</p>
      </div>
    </div>

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <img src="./bugatti.jpeg" alt=""
     class="w-full h-60 object-cover filter grayscale" />
      <div class="p-4">
        <h2 class="font-semibold text-lg">Grayscale Effect</h2>
        <p class="text-sm text-gray-600"><span class="font-bold">Filter grayscale</span> this filter makes image black and white</p>
      </div>
    </div>

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <img src="./Koenigsegg.jpeg"
           class="w-full h-60 object-cover filter blur" />
      <div class="p-4">
        <h2 class="font-semibold text-lg">Blur Effect</h2>
        <p class="text-sm text-gray-600"><span class="font-bold">Filter blur</span> Applies a subtle blur to the image.</p>
      </div>
    </div>

  </div>

</body>
</html>
